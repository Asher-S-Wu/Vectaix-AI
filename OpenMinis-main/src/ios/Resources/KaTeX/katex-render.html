<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="stylesheet" href="katex.min.css">
<script src="katex.min.js"></script>
<script src="mhchem.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: transparent;
    -webkit-text-size-adjust: none;
    overflow: hidden;
  }
  #math {
    display: inline-block;
    padding: 2px 4px;
    color: #000;
  }
</style>
</head>
<body>
<span id="math"></span>
<script>
function renderMath(latex, displayMode, fontSize) {
  try {
    // Use KaTeX's renderToString to get the HTML directly, avoiding WKWebView
    // snapshot issues (alpha=0 views produce blank snapshots on iOS 16+).
    var html = katex.renderToString(latex, {
      displayMode: displayMode,
      throwOnError: false,
      strict: false,
      trust: true,
      output: 'html'
    });
    // Render into the DOM to measure size.
    var el = document.getElementById('math');
    el.style.fontSize = fontSize + 'px';
    el.innerHTML = html;
    document.fonts.ready.then(function() {
      var rect = el.getBoundingClientRect();
      if (rect.width < 3 || rect.height < 3) {
        window.webkit.messageHandlers.mathRendered.postMessage({
          width: 0, height: 0,
          error: 'rendered content is empty (unsupported LaTeX?)'
        });
        return;
      }
      // Send the HTML string back to native for rendering via NSAttributedString
      // or a dedicated image renderer, along with the measured size.
      window.webkit.messageHandlers.mathRendered.postMessage({
        width: Math.ceil(rect.width),
        height: Math.ceil(rect.height),
        html: html,
        error: null
      });
    });
  } catch (e) {
    window.webkit.messageHandlers.mathRendered.postMessage({
      width: 0,
      height: 0,
      error: e.message
    });
  }
}
</script>
</body>
</html>
